description: >
  Identify each transported module file by its path in the python package tree of its module, rather than by
  the name of the python module it defines.
change-type: patch
destination-branches: [master]
sections:
  upgrade-note: |
    - Run a full export right after the upgrade if the project uses editable installed modules, or selects extras of
      an inmanta module in its `requirements.txt`, e.g. `inmanta-module-mymod[feature]`. Until then, partial exports
      fail.
