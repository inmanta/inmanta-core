description: >-
  `GET /api/v1/version` and `GET /api/v1/version/<id>` no longer return the `undeployable` and `skipped_for_undeployable`
  fields of a version.
issue-nr: 10277
change-type: major
destination-branches: [master]
sections:
  upgrade-note: >-
    `GET /api/v1/version` and `GET /api/v1/version/<id>` no longer return the `undeployable` and `skipped_for_undeployable`
    fields of a version. Nothing in the orchestrator used them, and after a partial compile they could miss resources.
