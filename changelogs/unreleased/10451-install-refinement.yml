---
description: >
  Install refinement of the improved code install on the agent. How the code of an inmanta module reaches an agent is
  now recorded as an explicit install mode: the module is installed in editable mode, installed as a package,
  or installed on disk outside of the venv. Inmanta modules that were installed in editable mode
  in the compiler venv are now reconstructed as proper, installable python packages on the agent and pip-installed in
  editable mode in the executor venv. To make this possible, the exporter also persists their packaging files
  (setup.cfg and pyproject.toml) alongside their plugin sources. Their python requirements are no longer persisted:
  pip resolves them from the setup.cfg it installs. Package install modules are unaffected.
change-type: minor
destination-branches: [master]
