---
description: >
  Inmanta modules installed in editable mode in the compiler venv, and all V1 modules, are now installed on the agent
  as python packages: the agent rebuilds each of them from the files the compiler exported and installs it with pip in
  editable mode. Their python dependencies are resolved from the module's setup.cfg, like for a module installed as a
  package. A module in editable mode that only holds plugin code, without any resource, handler, reference or mutator,
  is now exported and installed on the agents as well.
issue-nr: 10451
change-type: minor
destination-branches: [master]
