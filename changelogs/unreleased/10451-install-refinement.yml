---
description: >
  Install refinement of the improved code install on the agent. Inmanta modules that were installed in editable mode
  in the compiler venv are now reconstructed as proper, installable python packages on the agent and pip-installed in
  editable mode in the executor venv. To make this possible, the exporter also persists their packaging files
  (setup.cfg and pyproject.toml) alongside their plugin sources. Their python requirements are no longer persisted:
  pip resolves them from the setup.cfg it installs. Package install modules are unaffected.
change-type: minor
destination-branches: [master]
sections:
  upgrade-note: |
    - Plugin code in a package named 'model', 'files' or 'templates' (e.g. inmanta_plugins/<module>/model/__init__.py) is
      now loaded, both by the compiler and on the agent. It used to be skipped, because a module ships its model, files
      and templates content in directories with those names. Such a directory is only treated as module content if it has
      no __init__ file.
