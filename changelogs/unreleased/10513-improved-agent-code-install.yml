---
description: >
  The agents install the code of the inmanta modules the same way as the compiler. They install the package installed
  modules with pip, at the version that the compiler used. They rebuild the editable installed modules as python packages and install those in editable mode.
  This includes the 'helper' modules that only provide python code to the handlers of other modules, and the extras that
  the project selects for a module in its `requirements.txt`, e.g. `inmanta-module-mymod[feature]`.
issue-nr: 10513
change-type: minor
destination-branches: [master]
sections:
  minor-improvement: "{{description}}"
  upgrade-note: |
    - Run a full export right after the upgrade if the project selects extras of an inmanta module in its
      `requirements.txt`. Until then, partial exports fail.
    - Exporting a project fails if one of its modules is installed in editable mode and has no `pyproject.toml`. Add the
      `pyproject.toml` that `inmanta module create` generates to such a module.
    - Partial exports check every inmanta module that the model uses, including the 'helper' modules. The partial
      export fails if such a module changed since the base version, or if the project selects other extras for it. If
      the change is compatible with the deployed resources, use `inmanta export --allow-handler-code-update`.
