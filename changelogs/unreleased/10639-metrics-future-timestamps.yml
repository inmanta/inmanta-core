description: >
  Add the `exclude_future_timestamps` parameter to `GET /api/v2/metrics`. Together with `round_timestamps`, it makes
  the last time window end at the current time, instead of at the end of the requested interval rounded up to a time in
  the future. The `end_interval` parameter is now optional and defaults to the current time of the server.
issue-nr: 10639
change-type: minor
destination-branches: [master, iso9]
sections:
  minor-improvement: "{{description}}"
