description: Make the GraphQL schema compatible with strawberry-graphql 0.334 and remove the `strawberry-graphql<0.334` constraint.
issue-nr: 10921
change-type: minor
destination-branches: [master]
sections:
  upgrade-note: >-
    The `orderBy` argument of the GraphQL `notifications` and `resources` queries now has the input type
    `NotificationOrder` and `ResourceOrder` respectively, instead of `StrawberryOrder`. Queries that declare the type of an
    `orderBy` variable must use the new name.
