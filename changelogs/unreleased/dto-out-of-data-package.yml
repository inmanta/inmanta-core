description: Took the database layer off the compiler's import path. The data transfer objects moved out of inmanta/data/model.py into inmanta.dto, and the LogLine that handlers produce is now the pydantic inmanta.dto.LogLine rather than a separate DataDocument based class, so that needing a DTO or a log line no longer executes the database access layer in inmanta/data/__init__.py. inmanta.data.model and inmanta.data.LogLine are kept as re-exports for backwards compatibility, but prefer inmanta.dto in new code. DataDocument is removed: it predated pydantic and had no remaining purpose. A compile no longer imports inmanta.data or sqlalchemy at all, dropping from 1744 to 1528 loaded modules.
change-type: patch
destination-branches:
  - master
  - iso9
sections:
  minor-improvement: "{{description}}"
