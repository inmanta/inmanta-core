description: Took the database layer off the compiler's import path. The data transfer objects moved out of inmanta/data/model.py into inmanta.dto, and DataDocument and LogLine moved into inmanta.data_document, so that needing a DTO or a log line no longer executes the database access layer in inmanta/data/__init__.py. inmanta.data.model, inmanta.data.LogLine and inmanta.data.DataDocument are kept as re-exports for backwards compatibility, but prefer inmanta.dto and inmanta.data_document in new code. A compile no longer imports inmanta.data or sqlalchemy at all, dropping from 1744 to 1535 loaded modules.
change-type: patch
destination-branches:
  - master
  - iso9
sections:
  minor-improvement: "{{description}}"
