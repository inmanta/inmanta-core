---
description: >
  Export the editable installed modules that declare no resource, handler, reference or mutator, and only hold plugin
  code that the handler of another module imports.
change-type: patch
destination-branches: [master]
sections:
  bugfix: |
    - The agents installed an editable installed module that declares no resource, handler, reference or mutator from
      the package index, instead of from the module the compiler used, or failed to install it at all.
  upgrade-note: |
    - A partial export also checks the editable installed modules that declare no resource, handler, reference or
      mutator. One whose plugin code, version or python requirements changed since the version the partial export
      builds on is refused, like any other module, with "Cannot perform partial export because the source code for
      module ... is different from the currently registered source code". Use the `--allow-handler-code-update` option
      of `inmanta export` if the change is compatible with the resources that are already deployed.
