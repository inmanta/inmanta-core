description: >
  Identify each transported module file by its path in the python package tree of its module, rather than by
  the name of the python module it defines.
change-type: patch
destination-branches: [master]
sections:
  upgrade-note: |
    - If the project uses modules installed in editable mode, or requires an inmanta module with extras in its
      `requirements.txt` (e.g. `inmanta-module-mymod[feature]`), partial exports will fail after the upgrade until a
      full export is done. Run a full export right after the upgrade.
