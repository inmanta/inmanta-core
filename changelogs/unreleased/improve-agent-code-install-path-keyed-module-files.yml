description: >
  Identify each transported module file by its path in the python package tree of its module, rather than by
  the name of the python module it defines.
change-type: patch
destination-branches: [master]
sections:
  upgrade-note: |
    - Partial exports fail after the upgrade until a full export is done, if the project uses v1 modules or modules
      installed in editable mode. Run a full export right after the upgrade.
    - The export of a module installed in editable mode fails if two of its files define the same python
      module, e.g. `x.py` and `x/__init__.py`. Remove one of them.
