description: >
  Rebuild the editable installed modules on the agent as installable python packages, laid out exactly like the source
  tree they were exported from, and install them in editable mode. Pip fetches the build backend of these modules
  (setuptools) from the package index in the pip config of the project.
change-type: major
destination-branches: [master]
sections:
  bugfix: |
    - The plugin code of an editable installed module can use relative imports (e.g. `from . import helpers`). They
      work on the agent the same way as in the compiler.
