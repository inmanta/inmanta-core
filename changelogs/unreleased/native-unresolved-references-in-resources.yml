description: >-
  References are now eager or lazy on the agent: a resource field or reference constructor parameter annotated with
  `Reference` accepts lazy references, which reach the handler unresolved, `references.lazy()` marks a reference as lazy
  in a resource getter, and `@reference(..., lazy=True)` declares a reference class always lazy. `resolve_other()` is
  required for constructor parameters that accept lazy references.
change-type: minor
destination-branches: [master]
