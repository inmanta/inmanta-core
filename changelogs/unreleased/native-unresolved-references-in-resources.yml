description: >-
  References are now eager or lazy on the agent: a resource field annotated with
  `Reference` accepts lazy references, which reach the handler unresolved, and `references.lazy()` marks a reference as
  lazy in a resource getter. A reference class declared with `@reference(..., lazy_arguments=True)` gets the references
  in its arguments unresolved and resolves them itself with `resolve_other()`.
change-type: minor
destination-branches: [master]
sections:
  feature: "{{description}}"
  upgrade-note: >-
    The agent now rejects a reference in a log argument or a change report instead of storing its string representation:
    handlers and references must log or report the value of a reference, never the reference itself. A reference class
    declared with `lazy_arguments=True` must resolve every argument that can be a reference with `resolve_other()`.
