description: >
  The server rejects a full or a partial export when the requires relationships of the resources in the new version of the
  model contain a cycle, including a cycle that only appears when a partial export is merged with the previous version of
  the model.
change-type: minor
destination-branches: [master, iso9]
sections:
  minor-improvement: "{{description}}"
  upgrade-note: |
    - The exporter no longer checks the requires relationships of the resources for cycles. The server performs this
      check when the model is exported. Exports with `--no-commit` or `-j` no longer report cycles.
    - The `inmanta.export.DependencyCycleException` class was removed.
